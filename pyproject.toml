[project]
name = "project_board"
authors = [
    { name = "Dime Tech Group", email = "smutua@dimetechgroup.com" },
]
description = "Jira-style project management portal for ERPNext Projects"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<=17.0.0-dev"
erpnext = ">=15.0.0,<=17.0.0-dev"

[tool.bench.assets]
build_dir = "./frontend"
out_dir = "../project_board/public/frontend"
index_html_path = "../project_board/www/project-board.html"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017", "B018", "B023", "B904", "E101", "E402", "E501", "E741",
    "F401", "F403", "F405", "F722", "W191",
    "RUF001", "UP030", "UP031", "UP032",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
